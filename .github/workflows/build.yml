name: Build WordRealm APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 手动触发按钮

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 解压工程压缩包
        run: |
          ls -la
          unzip -o WordRealm_AndroidProject.zip -d .
          # 兼容 zip 内带顶层目录或不带的两种情况
          if [ -d AndroidProject ]; then mv AndroidProject/* AndroidProject/.[!.]* . 2>/dev/null || true; fi
          ls -la

      - name: ☕ 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 安装 Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 🔑 自动生成签名密钥
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/wordrealm.keystore \
            -alias wordrealm \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass wordrealm123 -keypass wordrealm123 \
            -dname "CN=WordRealm, OU=Dev, O=WordRealm, L=City, ST=State, C=CN"

      - name: 🔨 编译 Release APK
        run: gradle assembleRelease --no-daemon

      - name: 📤 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: WordRealm-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error